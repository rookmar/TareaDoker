
services:
  apiempresa:
    build:
      context: ./ApiEmpresa
      dockerfile: Dockerfile
    container_name: apiempresa
    ports:
      - "5212:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${MYSQL_CONNECTION:?Configura MYSQL_CONNECTION en .env}
    restart: unless-stopped

  appempresa:
    build:
      context: ./AppEmpresa
      dockerfile: Dockerfile
    container_name: appempresa
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: "http://apiempresa:8080/api/clientes"
    depends_on:
      - apiempresa
    restart: unless-stopped
